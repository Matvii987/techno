<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tecno - Магазин техніки</title>
    <link rel="icon" href="assets/icon-tecno.jpg" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">
        <span class="logo-icon">
            <i class="ti ti-bolt"></i>
        </span>
        <span class="logo-text">Tecno</span>
    </div>

    <div class="center">
        <div class="search-box">
            <input id="searchInput" type="search" placeholder="Пошук...">
            <i class="ti ti-microphone mic-icon" onclick="startVoice()"></i>
        </div>
        <button class="submit-btn">
            <i class="ti ti-search"></i>
        </button>
    </div>

    <div class="burger" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="menu">
        <button><i class="ti ti-category"></i> Каталог</button>
        <br>
        <button id="btn-basket" class="btn-basket">
            <i class="ti ti-shopping-cart"></i> Кошик
        </button>
    </div>

    <!-- Модальне вікно кошика -->
    <div id="overlay">
        <div id="modal">
            <button id="closeBtn"><i class="ti ti-x"></i></button>
            <div id="cartItems"></div>
        </div>
    </div>
</header>

<div class="filter">
    <button class="filter-btn">Смартфони</button>
    <button class="filter-btn">Ноутбуки</button>
    <button class="filter-btn">Планшети</button>
    <button class="filter-btn">Монітори</button>
</div>

<!-- Контейнер для товарів -->
<div class="products" id="productList"></div>

<script src="script.js"></script>
</body>
</html>
